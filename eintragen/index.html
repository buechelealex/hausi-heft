<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9762f">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon-192.png?v=1" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="../icon-192.png?v=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hausaufgaben">
<title>Hausaufgabe eintragen</title>
<link rel="stylesheet" href="../shared/base.css?v=1">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<header>
  <h1 id="pageTitle">Neue Hausaufgabe</h1>
  <p id="pageNote"></p>
</header>

<nav class="page-nav" id="nav"></nav>

<main class="container" data-view="eintragen">

  <p class="section-title">Aufgabe</p>
  <div class="card">
    <input type="text" id="titel" maxlength="80" autocomplete="off"
           placeholder="z. B. Buch S. 42, Nr. 3–5" aria-label="Aufgabe">
  </div>

  <p class="section-title">Fach</p>
  <div class="card">
    <div class="chips" id="fachChips"></div>
    <p class="hint" id="fachHint"></p>
  </div>

  <p class="section-title">Fällig am</p>
  <div class="card">
    <div class="chips" id="terminChips"></div>
    <div class="datum-zeile">
      <input type="date" id="datum" aria-label="Fällig am">
    </div>
    <p class="hint" id="datumHint"></p>
  </div>

  <p class="section-title">Notiz</p>
  <div class="card">
    <textarea id="notiz" maxlength="500" aria-label="Notiz"
              placeholder="Optional: Material, Abgabeform, Seitenzahlen …"></textarea>
  </div>

  <button type="button" class="primary-btn" id="saveBtn">Eintragen</button>

  <div class="foot">
    <button type="button" class="btn" id="cancelBtn">Abbrechen</button>
    <button type="button" class="btn danger" id="deleteBtn" hidden>Löschen</button>
  </div>

</main>

<script src="../shared/core.js?v=1"></script>
<script src="scripts.js?v=1"></script>
</body>
</html>
