<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9762f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png?v=1" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png?v=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hausaufgaben">
<meta name="description" content="Hausaufgabenheft für den Browser. Alle Einträge bleiben auf dem Gerät.">
<title>Hausaufgabenheft</title>
<link rel="stylesheet" href="shared/base.css?v=2">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <header>
      <h1>Hausaufgabenheft</h1>
      <p id="summary"></p>
    </header>
    <nav class="page-nav" id="nav"></nav>
  </div>
</div>

<!-- Am Laptop stehen Knopf, Filter und Hinweise links, die Aufgaben rechts.
     Am Handy fliesst alles untereinander in der Reihenfolge des Quelltexts. -->
<main class="container heft-layout" data-view="heft">

  <!-- Hinweis, falls der Browser nichts speichern darf (privates Fenster). -->
  <div id="warnSlot"></div>

  <!-- Marken zum Filtern nach Fach, sobald es etwas zu filtern gibt. -->
  <div id="filterSlot"></div>

  <!-- Offene Aufgaben, nach Termin gruppiert. -->
  <div id="liste"></div>

  <button type="button" class="primary-btn" id="addBtn">Hausaufgabe eintragen</button>

  <div class="foot" id="installSlot"></div>

  <p class="kbd-hint">
    <kbd>N</kbd> neue Aufgabe · <kbd>A</kbd> Archiv · <kbd>F</kbd> Fächer
  </p>

</main>

<script src="shared/core.js?v=2"></script>
<script src="scripts.js?v=2"></script>
</body>
</html>
